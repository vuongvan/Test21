name: Auto Increment & Trigger Build

on:
  push:
    branches:
      - dev
    paths:
      - 'OPExProvider/build.gradle.kts'
      - 'KKPExProvider/build.gradle.kts'
  workflow_dispatch:

jobs:
  increment-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump versions
        id: bump
        run: |
          FILES=(
            "OPExProvider/build.gradle.kts"
            "KKPExProvider/build.gradle.kts"
          )
          UPDATED=false
          SUMMARY=""

          for FILE in "${FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "⚠️  $FILE not found, skipping"
              continue
            fi

            CURRENT=$(grep -oP 'version\s*=\s*\K[0-9]+' "$FILE" | head -1)
            if [[ -z "$CURRENT" ]]; then
              echo "⚠️  No version found in $FILE, skipping"
              continue
            fi

            NEXT=$((CURRENT + 1))
            sed -i "s/version = $CURRENT/version = $NEXT/" "$FILE"
            echo "✅ $FILE: $CURRENT → $NEXT"
            SUMMARY="$SUMMARY\n- $FILE: $CURRENT → $NEXT"
            UPDATED=true
          done

          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          # Multiline safe output
          {
            echo "summary<<EOF"
            echo -e "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.updated == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add OPExProvider/build.gradle.kts KKPExProvider/build.gradle.kts
          git commit -m "chore: bump plugin versions [skip ci]"
          git push

      - name: Trigger build workflow
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref dev
          echo "🚀 Build workflow triggered on dev"

      - name: Summary
        if: steps.bump.outputs.updated == 'true'
        run: |
          echo "### ✅ Version bump complete" >> "$GITHUB_STEP_SUMMARY"
          echo -e "${{ steps.bump.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🚀 Build workflow triggered" >> "$GITHUB_STEP_SUMMARY"
          
